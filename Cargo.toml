[package]
name = "seekr-util"
version = "0.1.3"
edition = "2024"
description = "System search util for linux"
license = "MIT"
repository = "https://github.com/luxluth/seekr"
readme = "README.md"
homepage = "https://github.com/luxluth/seekr"
keywords = ["seekr", "launcher", "spotlight", "search", "gui"]
authors = ["luxluth <delphin.blehoussi93@gmail.com>"]

[dependencies]
exmex = "0.20.5"
gtk = { version = "0.10.3", package = "gtk4", features = ["v4_20"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
dbus = "0.9.10"
freedesktop-desktop-entry = "0.8.0" # =0.7.5
fuzzy-matcher = "0.3.7"
async-channel = "2.5.0"
tokio = { version = "1.48", features = ["rt", "rt-multi-thread", "sync"] }
fragile = "2.0.1"
ini-roundtrip = "0.2.1"
rust-i18n = "3.1.5"
once_cell = "1.21.3"
mlua = { version = "0.11.5", features = ["luajit", "vendored", "send"] }
glob = "0.3.3"
gtk4-layer-shell = { version = "0.7.1", optional = true }
glib-sys = { version = "=0.21.5", optional = true } # =0.20.10
tracker-sys = { version = "0.7.0", optional = true }
url-escape = { version = "0.1.1", optional = true }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"], optional = true }
roxmltree = "0.21.1"

[[bin]]
name = "seekr"
path = "src/main.rs"

[features]
default = []
localsearch = ["dep:glib-sys", "dep:tracker-sys", "dep:url-escape", "dep:chrono"]
gtk-layer-shell = ["dep:gtk4-layer-shell"]

[profile.release]
lto = true
codegen-units = 1
