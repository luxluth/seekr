[package]
name = "seekr-util"
version = "0.3.1"
edition = "2024"
description = "System search util for linux"
license = "MIT"
repository = "https://github.com/luxluth/seekr"
readme = "README.md"
homepage = "https://github.com/luxluth/seekr"
keywords = ["seekr", "launcher", "spotlight", "search", "gui"]
authors = ["luxluth <delphin.blehoussi93@gmail.com>"]

[dependencies]
exmex = "0.20.5"
gtk = { version = "0.11.3", package = "gtk4", features = ["v4_20"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
dbus = "0.9.11"
freedesktop-desktop-entry = "0.8.1"
fuzzy-matcher = "0.3.7"
async-channel = "2.5.0"
tokio = { version = "1.52", features = ["rt", "rt-multi-thread", "sync"] }
fragile = "2.0.1"
ini-roundtrip = "0.2.1"
rust-i18n = "4.0.0"
once_cell = "1.21.4"
mlua = { version = "0.11.6", features = ["lua54", "vendored", "send"] }
glob = "0.3.3"
gtk4-layer-shell = { version = "0.8.0", optional = true }
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std"] }
serde_json = "1.0.149"
tantivy = "0.26.1"
jwalk = "0.8.1"
notify-debouncer-mini = "0.7.0"
dirs = "6.0.0"
serde = "1.0.228"
mime_guess = "2.0.5"

[[bin]]
name = "seekr"
path = "src/main.rs"

[features]
default = []
gtk-layer-shell = ["dep:gtk4-layer-shell"]

[profile.release]
lto = true
codegen-units = 1
