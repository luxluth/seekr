[package]
name = "seekr-util"
version = "0.1.2"
edition = "2024"
description = "System search util for linux"
license = "MIT"
repository = "https://github.com/luxluth/seekr"
readme = "README.md"
homepage = "https://github.com/luxluth/seekr"
keywords = ["seekr", "launcher", "spotlight", "search", "gui"]
authors = ["luxluth <delphin.blehoussi93@gmail.com>"]

[dependencies]
exmex = "0.20.4"
gtk = { version = "0.9.6", package = "gtk4", features = ["v4_16"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
dbus = "0.9.7"
freedesktop-desktop-entry = "=0.7.5"
fuzzy-matcher = "0.3.7"
async-channel = "2.3.1"
tokio = { version = "1.45.1", features = ["rt", "rt-multi-thread", "sync"] }
fragile = "2.0.1"
ini-roundtrip = "0.2.0"
rust-i18n = "3.1.5"
once_cell = "1.21.3"
mlua = { version = "0.10.5", features = ["luajit", "vendored", "send"] }
glob = "0.3.2"
gtk4-layer-shell = { version = "0.5.0", optional = true }
glib-sys = { version = "0.20.10", optional = true }
tracker-sys = { version = "0.6.0", optional = true }
url-escape = { version = "0.1.1", optional = true }
chrono = { version = "0.4.41", default-features = false, features = ["clock", "std"], optional = true }

[[bin]]
name = "seekr"
path = "src/main.rs"

[features]
default = []
localsearch = ["dep:glib-sys", "dep:tracker-sys", "dep:url-escape", "dep:chrono"]
gtk-layer-shell = ["dep:gtk4-layer-shell"]

[profile.release]
lto = true
codegen-units = 1
